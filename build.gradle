plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'io.rest-assured:rest-assured:6.3.0'
    testImplementation 'io.rest-assured:json-schema-validator:6.3.0'
    testImplementation 'com.github.javafaker:javafaker:1.0.2'
    testImplementation 'org.testng:testng:7.12.0'
    testImplementation 'org.apache.poi:poi:6.0.0'
    testImplementation 'org.apache.poi:poi-ooxml:6.0.0'
    testImplementation 'com.aventstack:extentreports:5.1.2'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.25.4'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.25.4'
    testImplementation 'io.rest-assured:json-schema-validator:6.3.0'
}

test {
    useTestNG(){
        suites 'src/test/resources/testng.xml'
    }
}